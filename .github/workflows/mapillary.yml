name: Fetch Mapillary photos

# Matches cafes to the physically-closest Mapillary street-level image (by
# location) and commits the free photo cache (data/mapillary.json). Mapillary's
# read API is free and unmetered, and this is NOT part of the site build, so it
# never runs on a deploy.
#
# Runs on demand, AND automatically whenever the cafe list changes (e.g. the
# weekly update adds cafes). The fetcher is incremental — it skips cafes already
# in the cache, and skips cafes that already have a Google Places or HotPepper
# photo (Mapillary is tier 3) — so an auto-run only looks up the NEW, uncovered
# cafes. The commit it makes touches only mapillary.json (not venues.json) and is
# made with GITHUB_TOKEN, so it can't retrigger this workflow — no loop.
#
# Requires the MAPILLARY_TOKEN repo secret (format MLY|<app id>|<secret>). If it
# is absent the fetcher no-ops gracefully, so the workflow is safe without it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/seed/venues.json"

permissions:
  contents: write

jobs:
  mapillary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Match cafes to Mapillary (prints how many matched)
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: node scripts/fetch-mapillary.mjs
      - name: Commit photo cache
        run: |
          git config user.name "k9tsune"
          git config user.email "308644872+k9tsune@users.noreply.github.com"
          git add data/mapillary.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Populate Mapillary cafe photos"
            git push
          fi
